<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mellow Giriş</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F0F4F8; --primary: #FF8B94; --primary-shadow: #D8606B; --text: #2D3436; }
  body { margin: 0; font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; align-items: center; }
  .auth-box { background: white; padding: 30px; border-radius: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); width: 85%; max-width: 350px; text-align: center; }
  h1 { margin-top: 0; color: var(--primary); font-size: 28px; }
  input { width: 100%; box-sizing: border-box; padding: 15px; margin-bottom: 15px; border: 3px solid #E1E8ED; border-radius: 15px; font-family: inherit; font-weight: 700; font-size: 16px; outline: none; }
  input:focus { border-color: var(--primary); }
  .btn { width: 100%; background: var(--primary); border: 3px solid var(--primary-shadow); border-radius: 15px; padding: 15px; font: inherit; font-size: 18px; font-weight: 800; color: white; cursor: pointer; box-shadow: 0 6px 0 var(--primary-shadow); transition: all 0.1s; margin-bottom: 15px; }
  .btn:active { transform: translateY(6px); box-shadow: 0 0 0 transparent; }
  .switch { font-size: 14px; font-weight: 700; color: #A0AAB2; cursor: pointer; }
</style>
</head>
<body>

<div class="auth-box">
  <h1 id="title">Mellow'a Gir</h1>
  <input type="text" id="username" placeholder="Kullanıcı Adı" required>
  <input type="password" id="password" placeholder="Şifre" required>
  <button class="btn" onclick="submitAuth()">İçeri Dal!</button>
  <div class="switch" onclick="toggleMode()" id="switchText">Hesabın yok mu? Kayıt Ol</div>
</div>

<script>
  let mode = 'login';
  
  function toggleMode() {
      mode = mode === 'login' ? 'signup' : 'login';
      document.getElementById('title').innerText = mode === 'login' ? "Mellow'a Gir" : "Mellow'a Katıl";
      document.getElementById('switchText').innerText = mode === 'login' ? "Hesabın yok mu? Kayıt Ol" : "Zaten hesabın var mı? Giriş Yap";
  }

  async function submitAuth() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      
      const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass, mode: mode })
      });
      
      const data = await res.json();
      if (data.success) {
          window.location.href = '/'; // Giriş başarılıysa oyuna yönlendir
      } else {
          alert("Hata: " + (data.error || "Bir şeyler ters gitti"));
      }
  }
</script>
</body>
</html>
